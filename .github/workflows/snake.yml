# ═══════════════════════════════════════════════════════════════════════
#  GitHub Contribution Snake Animation
#  ───────────────────────────────────────────────────────────────────────
#  Place this file at: .github/workflows/snake.yml
#  in your z-lovejeet/z-lovejeet profile repository.
#
#  After pushing, go to Actions tab → "Generate Snake" → Run workflow
#  The snake SVG will be committed to the "output" branch automatically.
# ═══════════════════════════════════════════════════════════════════════
name: Generate Snake
on:
  # Regenerate every day at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # ── Generate snake SVGs ──────────────────────────────────────────
      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: z-lovejeet
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#3DDBD9&color_dots=#0D1117,#0e4429,#006d32,#26a641,#39d353
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ── Push to output branch ───────────────────────────────────────
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}