<svg xmlns="http://www.w3.org/2000/svg" width="850" height="180" viewBox="0 0 850 180">
  <defs>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="10%" stop-color="#58a6ff" stop-opacity="1"/>
      <stop offset="90%" stop-color="#3ddbd9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3ddbd9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="850" height="180" fill="#0d1117" rx="10"/>
  <rect width="850" height="180" fill="none" stroke="#21262d" stroke-width="1" rx="10"/>

  <!-- Grid lines -->
  <line x1="50" y1="30" x2="825" y2="30" stroke="#21262d" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="50" y1="60" x2="825" y2="60" stroke="#21262d" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="50" y1="90" x2="825" y2="90" stroke="#21262d" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="50" y1="120" x2="825" y2="120" stroke="#21262d" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="50" y1="145" x2="825" y2="145" stroke="#21262d" stroke-width="0.5"/>

  <!-- Y-axis labels -->
  <text x="38" y="34" fill="#484f58" font-family="'Consolas',monospace" font-size="9" text-anchor="end">12</text>
  <text x="38" y="64" fill="#484f58" font-family="'Consolas',monospace" font-size="9" text-anchor="end">9</text>
  <text x="38" y="94" fill="#484f58" font-family="'Consolas',monospace" font-size="9" text-anchor="end">6</text>
  <text x="38" y="124" fill="#484f58" font-family="'Consolas',monospace" font-size="9" text-anchor="end">3</text>
  <text x="38" y="149" fill="#484f58" font-family="'Consolas',monospace" font-size="9" text-anchor="end">0</text>

  <!-- Area fill (smooth contribution curve) -->
  <path d="M 50,120 L 75.8,110 L 101.7,126 L 127.5,96 L 153.3,106 L 179.2,82 L 205,92 L 230.8,120 L 256.7,68 L 282.5,96 L 308.3,82 L 334.2,110 L 360,92 L 385.8,72 L 411.7,106 L 437.5,126 L 463.3,96 L 489.2,82 L 515,58 L 540.8,86 L 566.7,106 L 592.5,72 L 618.3,110 L 644.2,96 L 670,82 L 695.8,106 L 721.7,86 L 747.5,72 L 773.3,96 L 799.2,110 L 825,82 L 825,145 L 50,145 Z"
    fill="url(#areaFill)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze" begin="0.5s"/>
  </path>

  <!-- Glow line behind main line -->
  <path d="M 50,120 L 75.8,110 L 101.7,126 L 127.5,96 L 153.3,106 L 179.2,82 L 205,92 L 230.8,120 L 256.7,68 L 282.5,96 L 308.3,82 L 334.2,110 L 360,92 L 385.8,72 L 411.7,106 L 437.5,126 L 463.3,96 L 489.2,82 L 515,58 L 540.8,86 L 566.7,106 L 592.5,72 L 618.3,110 L 644.2,96 L 670,82 L 695.8,106 L 721.7,86 L 747.5,72 L 773.3,96 L 799.2,110 L 825,82"
    fill="none" stroke="#58a6ff" stroke-width="6" opacity="0.12"
    stroke-dasharray="1800" stroke-dashoffset="1800" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke-dashoffset" from="1800" to="0" dur="2s" fill="freeze" begin="0.3s"/>
  </path>

  <!-- Main contribution line -->
  <path d="M 50,120 L 75.8,110 L 101.7,126 L 127.5,96 L 153.3,106 L 179.2,82 L 205,92 L 230.8,120 L 256.7,68 L 282.5,96 L 308.3,82 L 334.2,110 L 360,92 L 385.8,72 L 411.7,106 L 437.5,126 L 463.3,96 L 489.2,82 L 515,58 L 540.8,86 L 566.7,106 L 592.5,72 L 618.3,110 L 644.2,96 L 670,82 L 695.8,106 L 721.7,86 L 747.5,72 L 773.3,96 L 799.2,110 L 825,82"
    fill="none" stroke="url(#lineGlow)" stroke-width="2"
    stroke-dasharray="1800" stroke-dashoffset="1800" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke-dashoffset" from="1800" to="0" dur="2s" fill="freeze" begin="0.3s"/>
  </path>

  <!-- Data points (appear after line draws) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2s"/>
    <circle cx="50" cy="120" r="2" fill="#3ddbd9" opacity="0.5"/>
    <circle cx="127.5" cy="96" r="2" fill="#3ddbd9" opacity="0.5"/>
    <circle cx="256.7" cy="68" r="2.5" fill="#3ddbd9" opacity="0.7"/>
    <circle cx="385.8" cy="72" r="2.5" fill="#3ddbd9" opacity="0.7"/>
    <circle cx="515" cy="58" r="3" fill="#3ddbd9" opacity="0.9"/>
    <circle cx="592.5" cy="72" r="2.5" fill="#3ddbd9" opacity="0.7"/>
    <circle cx="747.5" cy="72" r="2.5" fill="#3ddbd9" opacity="0.7"/>
    <circle cx="825" cy="82" r="2" fill="#3ddbd9" opacity="0.5"/>
  </g>

  <!-- X-axis date labels -->
  <text x="50" y="162" fill="#484f58" font-family="'Consolas',monospace" font-size="8" text-anchor="middle">Aug 3</text>
  <text x="179.2" y="162" fill="#484f58" font-family="'Consolas',monospace" font-size="8" text-anchor="middle">Aug 8</text>
  <text x="308.3" y="162" fill="#484f58" font-family="'Consolas',monospace" font-size="8" text-anchor="middle">Aug 13</text>
  <text x="437.5" y="162" fill="#484f58" font-family="'Consolas',monospace" font-size="8" text-anchor="middle">Aug 18</text>
  <text x="566.7" y="162" fill="#484f58" font-family="'Consolas',monospace" font-size="8" text-anchor="middle">Aug 23</text>
  <text x="695.8" y="162" fill="#484f58" font-family="'Consolas',monospace" font-size="8" text-anchor="middle">Aug 28</text>
  <text x="825" y="162" fill="#484f58" font-family="'Consolas',monospace" font-size="8" text-anchor="middle">Sep 2</text>
</svg>
