<svg xmlns="http://www.w3.org/2000/svg" width="850" height="12" viewBox="0 0 850 12">
  <!-- Base line -->
  <line x1="0" y1="6" x2="850" y2="6" stroke="#21262d" stroke-width="0.5"/>

  <!-- Traveling glow dot -->
  <circle r="2.5" cy="6" opacity="0.7">
    <animate attributeName="cx" values="0;850;0" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="fill" values="#58a6ff;#3ddbd9;#a371f7;#58a6ff" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>
